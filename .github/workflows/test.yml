name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Least privilege: the default GITHUB_TOKEN can only read repository contents.
permissions:
  contents: read

# Cancel superseded runs of the same workflow on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job below is gated so that only the repository owner can trigger CI.
# Pull requests must also come from a branch of this repository (never a fork),
# so fork code never runs with this repository's context.
#
#   if: >-
#     github.actor == github.repository_owner &&
#     (github.event_name != 'pull_request' ||
#     github.event.pull_request.head.repo.full_name == github.repository)

jobs:
  test:
    name: Test on Deno ${{ matrix.deno-version }}
    runs-on: ubuntu-latest
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)

    strategy:
      matrix:
        deno-version: ["latest"]

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ matrix.deno-version }}

      - name: Cache Deno dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/deno
            ~/.deno
          key: ${{ runner.os }}-deno-${{ hashFiles('**/deno.lock') }}
          restore-keys: |
            ${{ runner.os }}-deno-

      - name: Check Deno formatting
        run: deno fmt --check

      - name: Run Deno linter
        run: deno lint

      - name: Run scenario-flow core tests
        run: |
          cd scenario-flow
          deno test --allow-net --allow-read --allow-env --coverage=coverage

      - name: Generate coverage report
        run: |
          cd scenario-flow
          deno coverage coverage --lcov --output=coverage.lcov

      # Token-less upload: no secret is passed to this step. Failures are
      # non-fatal so the pipeline does not depend on a third-party service.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: ./scenario-flow/coverage.lcov
          flags: scenario-flow-core
          name: scenario-flow-core-coverage
          fail_ci_if_error: false

      - name: Run scenario-flow-cli tests
        run: |
          cd scenario-flow-cli
          deno test --allow-read --allow-run --allow-net

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-results-${{ matrix.deno-version }}
          path: |
            scenario-flow/coverage/
            scenario-flow/coverage.lcov

  test-examples:
    name: Test Examples
    runs-on: ubuntu-latest
    needs: test
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "latest"

      - name: Test example scenarios
        run: |
          cd example
          # Check if example files are valid TypeScript
          deno check scenario/*.sf.ts

      - name: Start sample API server
        run: |
          cd example
          deno run -A sample-api/server.ts > server.log 2>&1 &
          echo $! > server.pid
          # Wait until the server answers on port 3323 (max 30s)
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null -X POST -H 'Content-Type: application/json' \
                 -d '{}' http://localhost:3323/login; then
              echo "sample server is up (attempt $i)"
              exit 0
            fi
            sleep 1
          done
          echo "sample server did not start in time"
          cat server.log
          exit 1

      - name: Validate scenario-flow-cli with examples
        run: |
          cd scenario-flow-cli
          deno run --allow-read --allow-run --allow-net main.ts ../example

      - name: Stop sample API server
        if: always()
        run: |
          cd example
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" || true
          fi

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "latest"

      # Only module specifiers are printed; nothing here echoes environment
      # variables or enables shell tracing.
      - name: Run security audit
        run: |
          # List remote module specifiers pulled in by the library
          deno info --json scenario-flow/mod.ts | jq -r '.modules[].specifier' | grep -E '^https?://' | sort -u

          # Validate import integrity
          cd scenario-flow
          deno cache --reload mod.ts

          cd ../scenario-flow-cli
          deno cache --reload main.ts

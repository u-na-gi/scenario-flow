name: Publish to JSR

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Least privilege by default; the publish job adds `id-token: write` for JSR
# OIDC (no long-lived token is stored as a repository secret).
permissions:
  contents: read

# Never run two publishes at once, but do not cancel one that is in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Only the repository owner may publish, whether via a `v*` tag push, a
    # manual `workflow_dispatch`, or a re-run. For anyone else this job is a
    # no-op.
    if: >-
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner

    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        deno-version: ["latest"]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ matrix.deno-version }}

      - name: Run tests
        run: |
          cd scenario-flow
          deno test --allow-net --allow-read --allow-env --coverage=coverage

      - name: Check formatting
        run: |
          cd scenario-flow
          deno fmt --check

      - name: Lint code
        run: |
          cd scenario-flow
          deno lint

      - name: Publish to JSR
        run: |
          cd scenario-flow
          npx jsr publish
